name: Validate

# Only code/version changes run CI (D-019). Tag pushes (versions) always run:
# GitHub ignores `paths` for tag pushes.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: &code_paths
      - "custom_components/**"
      - "tests/**"
      - "tools/**"
      - "hacs.json"
      - "requirements_test.txt"
      - "pytest.ini"
      - ".github/workflows/**"
  pull_request:
    paths: *code_paths

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Not in home-assistant/brands (yet); the brands check would always fail.
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest -q tests/test_core.py -p no:homeassistant
      - run: pytest -q tests/ha
